<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d9e75">
<meta name="description" content="Controle de gastos por cartão: dia 2 (Itaú) e dia 8 (MP).">
<title>Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 9V7a2 2 0 0 1 2-2h11l-3-3m3 3-3 3M20 15v2a2 2 0 0 1-2 2H7l3 3m-3-3 3-3"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M4 20h16"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5m0 0L8 9m4-4 4 4M4 20h16"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.4M12 18.6V21M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M3 12h2.4M18.6 12H21M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></symbol>
  <symbol id="i-broom" viewBox="0 0 24 24"><path d="M14 4l6 6-7 7-6-6z"/><path d="M9 15l-6 6M5 17l2 2M4 20l2 2"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h9.5a3.5 3.5 0 0 0 .6-6.95 5.5 5.5 0 0 0-10.6-2A4 4 0 0 0 7 18z"/></symbol>
</svg>

<header class="topbar">
  <button type="button" class="icon-btn" id="btn-prev" aria-label="Mês anterior">
    <svg class="icon"><use href="#i-left"></use></svg>
  </button>
  <h1 class="topbar-title" id="month-label">—</h1>
  <button type="button" class="icon-btn" id="btn-next" aria-label="Mês seguinte">
    <svg class="icon"><use href="#i-right"></use></svg>
  </button>
  <button type="button" class="icon-btn" id="btn-settings" aria-label="Configurações">
    <svg class="icon"><use href="#i-gear"></use></svg>
  </button>
</header>

<main id="screen" aria-live="polite"></main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="file-input" accept="application/json,.json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
