<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos — testes</title>
<link rel="stylesheet" href="styles.css">
<style>
  main { max-width: 720px; }
  .case { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .case b { font-weight: 500; }
  .ok { color: var(--accent); }
  .fail { color: var(--danger); }
  .detail { color: var(--text-soft); font-size: 12.5px; }
  h2 { font-size: 15px; font-weight: 500; margin: 22px 0 2px; }
  #head { position: sticky; top: 0; background: var(--bg); padding: 10px 0; font-size: 17px; font-weight: 500; }
</style>
</head>
<body>
<main>
  <div id="head">Rodando…</div>
  <div id="out"></div>
</main>

<script type="module">
import { splitInstallments, parseValueInput, formatCents } from './js/money.js';
import {
  addMonths, monthDiff, periodLabel, monthSummary, installmentsOf, entriesFor,
  purgeCutoff, purgePlan,
} from './js/model.js';
import { parseFala, wordsToNumber } from './js/voice.js';
import { buildSnapshotPayload, isValidSheetsUrl } from './js/sheets.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

function group(name) {
  const h = document.createElement('h2');
  h.textContent = name;
  out.appendChild(h);
}

function check(label, actual, expected) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  const ok = a === e;
  ok ? pass++ : fail++;
  const row = document.createElement('div');
  row.className = 'case';
  row.innerHTML = `<span class="${ok ? 'ok' : 'fail'}">${ok ? '✓' : '✕'}</span>
    <span><b>${label}</b>${ok ? '' : `<br><span class="detail">esperado ${e}<br>obtido&nbsp;&nbsp; ${a}</span>`}</span>`;
  out.appendChild(row);
}

// ---------- divisao de parcelas: a soma tem de fechar sempre

group('Divisão de parcelas');
check('100,00 em 3x', splitInstallments(10000, 3), [3333, 3333, 3334]);
check('10,00 em 3x', splitInstallments(1000, 3), [333, 333, 334]);
check('0,05 em 2x', splitInstallments(5, 2), [2, 3]);
check('100,00 à vista', splitInstallments(10000, 1), [10000]);
check('0,01 em 3x', splitInstallments(1, 3), [0, 0, 1]);
for (const [total, n] of [[10000, 3], [1, 3], [99999, 7], [12345, 11], [5, 2], [777, 60]]) {
  const parts = splitInstallments(total, n);
  check(`soma fecha: ${formatCents(total)} em ${n}x`,
    [parts.reduce((a, b) => a + b, 0), parts.length], [total, n]);
}

// ---------- leitura de valores digitados

group('Valores digitados');
const valores = [['1.234,56', 123456], ['1234,56', 123456], ['100', 10000],
  ['1.500', 150000], ['100.50', 10050], ['R$ 89,90', 8990], ['0,05', 5],
  ['2600', 260000], ['abc', null], ['', null]];
for (const [input, expected] of valores) check(`"${input}"`, parseValueInput(input), expected);
check('formata 2.566,67', formatCents(256667), '2.566,67');

// ---------- meses

group('Meses');
check('2026-12 + 1', addMonths('2026-12', 1), '2027-01');
check('2026-01 − 1', addMonths('2026-01', -1), '2025-12');
check('2026-08 + 5', addMonths('2026-08', 5), '2027-01');
check('diferença ago→out', monthDiff('2026-08', '2026-10'), 2);

// ---------- cenário do enunciado

group('Cenário do enunciado');
const st = {
  config: { startMonth: '2026-08' },
  expenses: [
    { id: 'e1', description: 'Sapato loja Bennys', date: '2026-08-27', month: '2026-08', period: 30, totalCents: 10000, installments: 3 },
    { id: 'e2', description: 'Mercado Extra', date: '2026-08-08', month: '2026-08', period: 15, totalCents: 45000, installments: 1 },
  ],
};
const pocket = (m, p) => {
  const s = monthSummary(st, m).periods.find((x) => x.period === p);
  return {
    gasto: formatCents(s.spent),
    linhas: s.entries.map((e) => `${e.isParceled ? `${e.index}/${e.of}` : '—'} ${formatCents(e.cents)}${e.isFinalWarning ? ' VERMELHO' : ''}`),
  };
};
check('ago · dia 2 (Itaú)', pocket('2026-08', 15), { gasto: '450,00', linhas: ['— 450,00'] });
check('ago · dia 8 (MP)', pocket('2026-08', 30), { gasto: '33,33', linhas: ['1/3 33,33'] });
check('set · dia 8 (replicado)', pocket('2026-09', 30), { gasto: '33,33', linhas: ['2/3 33,33'] });
check('out · dia 8 (última, vermelho)', pocket('2026-10', 30), { gasto: '33,34', linhas: ['3/3 33,34 VERMELHO'] });
check('nov · dia 8 (acabou)', pocket('2026-11', 30), { gasto: '0,00', linhas: [] });
check('set · dia 2 (não herda à vista)', pocket('2026-09', 15), { gasto: '0,00', linhas: [] });
check('à vista não fica vermelho',
  installmentsOf(st.expenses[1]).map((p) => p.isFinalWarning), [false]);
check('parcela fica no bolso de origem',
  entriesFor(st, '2026-10', 15).length, 0);

// ---------- numerais escritos

group('Numerais em português');
const numerais = [[['cem'], 100], [['cento', 'e', 'vinte', 'e', 'cinco'], 125],
  [['mil', 'e', 'duzentos'], 1200], [['dois', 'mil', 'e', 'quinhentos'], 2500],
  [['quatrocentos', 'e', 'cinquenta'], 450], [['dezessete'], 17],
  [['tres'], 3], [['noventa', 'e', 'nove'], 99], [['banana'], null]];
for (const [tokens, expected] of numerais) check(tokens.join(' '), wordsToNumber(tokens), expected);

// ---------- fala

group('Fala transcrita');
const HOJE = '2026-08-27';
const falas = [
  ['vinte e sete de agosto sapato loja bennys cem reais em três vezes', '2026-08-27', 'Sapato loja bennys', 10000, 3],
  ['hoje mercado extra quatrocentos e cinquenta reais', '2026-08-27', 'Mercado extra', 45000, 1],
  ['27/08 sapato loja bennys 100,00 3x', '2026-08-27', 'Sapato loja bennys', 10000, 3],
  ['farmácia 950 reais', '2026-08-27', 'Farmácia', 95000, 1],
  ['cento e vinte e cinco reais e cinquenta centavos posto ipiranga em 2 vezes', '2026-08-27', 'Posto ipiranga', 12550, 2],
  ['ontem uber 32,90', '2026-08-26', 'Uber', 3290, 1],
  ['mil e duzentos reais notebook em 10 vezes', '2026-08-27', 'Notebook', 120000, 10],
  ['dia 5 aluguel 1.500', '2026-08-05', 'Aluguel', 150000, 1],
  ['gastei R$ 89,90 na padaria', '2026-08-27', 'Padaria', 8990, 1],
  ['comprei uma geladeira parcelado em 12 dois mil e quinhentos reais', '2026-08-27', 'Geladeira', 250000, 12],
  ['academia 120 reais sem juros', '2026-08-27', 'Academia', 12000, 1],
  ['pão de queijo cinco reais e cinquenta centavos', '2026-08-27', 'Pão de queijo', 550, 1],
  ['netflix 55,90 hoje', '2026-08-27', 'Netflix', 5590, 1],
  ['15 de setembro seguro do carro 3.200 em 4 vezes', '2026-09-15', 'Seguro do carro', 320000, 4],
  ['anteontem estacionamento 15 reais', '2026-08-25', 'Estacionamento', 1500, 1],
  ['31/12/2026 presente de natal 480 reais em 6 vezes', '2026-12-31', 'Presente de natal', 48000, 6],
];
for (const [fala, date, description, totalCents, installments] of falas) {
  const r = parseFala(fala, HOJE);
  check(`"${fala}"`,
    { date: r.date, description: r.description, totalCents: r.totalCents, installments: r.installments },
    { date, description, totalCents, installments });
}
check('fala vazia não inventa valor',
  (() => { const r = parseFala('', HOJE); return [r.totalCents, r.installments, r.description]; })(),
  [null, 1, '']);
check('data inválida cai em hoje', parseFala('40/13 mercado 50 reais', HOJE).date, HOJE);

// ---------- limpeza de meses passados

group('Limpar gastos antigos');
check('corte de 4 meses a partir de agosto', purgeCutoff(4, '2026-08'), '2026-04');
check('corte de 1 mês a partir de janeiro', purgeCutoff(1, '2026-01'), '2025-12');
const stPurge = {
  config: { startMonth: '2026-01' },
  expenses: [
    { id: 'e1', description: 'Compra velha encerrada', date: '2026-02-05', month: '2026-02', period: 15, totalCents: 9000, installments: 1 },
    { id: 'e2', description: 'Financiamento ainda rodando', date: '2026-03-10', month: '2026-03', period: 30, totalCents: 120000, installments: 12 },
    { id: 'e3', description: 'Compra atual', date: '2026-08-01', month: '2026-08', period: 15, totalCents: 5000, installments: 1 },
  ],
};
const plan = purgePlan(stPurge, purgeCutoff(4, '2026-08'));
check('remove só o que já encerrou', plan.expenses.map((e) => e.id), ['e1']);
check('mantém compra com parcela ainda em aberto', plan.keepRunning.map((e) => e.id), ['e2']);
check('não mexe na compra do mês atual', plan.expenses.some((e) => e.id === 'e3'), false);
check('nada para limpar quando corte é antes de tudo',
  purgePlan(stPurge, '2025-01').nothingToDo, true);

// ---------- rótulos dos períodos

group('Rótulos dos períodos');
check('período 15 mostra "Dia 2 - Cartão Itaú"', periodLabel(15), 'Dia 2 - Cartão Itaú');
check('período 30 mostra "Dia 8 - Cartão MP"', periodLabel(30), 'Dia 8 - Cartão MP');

// ---------- backup automático na planilha (Google Sheets)

group('Backup na planilha');
check('URL válida (Apps Script)', isValidSheetsUrl('https://script.google.com/macros/s/AKfycb.../exec'), true);
check('URL sem https é inválida', isValidSheetsUrl('http://script.google.com/x'), false);
check('URL vazia é inválida', isValidSheetsUrl(''), false);
check('URL indefinida é inválida', isValidSheetsUrl(undefined), false);

const stSnap = {
  config: { startMonth: '2026-08', keepMonths: 4 },
  expenses: [
    { id: 'e1', description: 'Sapato', date: '2026-08-27', month: '2026-08', period: 30, totalCents: 10000, installments: 3 },
  ],
};
const snap = buildSnapshotPayload(stSnap, '{"json":"completo"}');
check('resumo traz o total de compras registradas',
  [snap.resumo.mesInicialDoApp, snap.resumo.manterUltimosMeses, snap.resumo.totalDeComprasRegistradas],
  ['Agosto 2026', 4, 1]);
check('gastos trazem a compra formatada nos novos rótulos',
  snap.gastos, [{ data: '2026-08-27', descricao: 'Sapato', mes: 'Agosto 2026', periodo: 'Dia 8 - Cartão MP', valorTotal: '100,00', parcelas: 3 }]);
check('a foto carrega o mesmo texto do export local (fidelidade total)',
  snap.json, '{"json":"completo"}');
check('geradoEm é uma data ISO válida',
  typeof snap.geradoEm === 'string' && !Number.isNaN(Date.parse(snap.geradoEm)), true);

// ---------- resultado

const head = document.getElementById('head');
head.textContent = fail === 0
  ? `${pass} testes passaram`
  : `${fail} de ${pass + fail} falharam`;
head.className = fail === 0 ? 'ok' : 'fail';
document.title = fail === 0 ? `OK (${pass})` : `FALHOU (${fail})`;
</script>
</body>
</html>
